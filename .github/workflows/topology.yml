# topology: fleet wiring gates + rendered topography on push to main
# (path-scoped), pull_request (path-scoped), and manual workflow_dispatch.
#
#   - scripts/topology.py --check-only logic is fail-closed: unresolvable
#     reports_to, unknown collaborators/skills/servers/packages, rig.yaml <->
#     fleet drift, fragment mismatch, and bad edge endpoints all exit 1.
#   - SVGs + graph.json + matrix.md upload as artifacts; a summary lands as a
#     PR comment. Orphan / omni-divergence findings are advisory (WARN only).
#   - Third-party actions pinned to full commit SHAs (repo policy).
name: topology

concurrency:
  group: topology-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "fleet/**"
      - "scripts/topology.py"
      - "rigs/**/rig.yaml"
      - "rigs/heretek-omni-fleet/members/**"
      - "specs/**"
      - "Makefile"
      - ".github/workflows/topology.yml"
  pull_request:
    paths:
      - "fleet/**"
      - "scripts/topology.py"
      - "rigs/**/rig.yaml"
      - "rigs/heretek-omni-fleet/members/**"
      - "specs/**"
      - "Makefile"
      - ".github/workflows/topology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring:
    name: Wiring gates + topography
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends graphviz
      - run: pip install --quiet pyyaml
      - run: make topology OUT=topology-out
      - name: Summary
        id: summary
        run: |
          read nodes edges seats advisories < <(python3 - <<'PY'
          import json
          g = json.load(open('topology-out/graph.json'))
          from collections import Counter
          t = Counter(n['type'] for n in g['nodes'])
          adv = [l[2:] for l in open('topology-out/advisory.md') if l.startswith('- ')]
          print(len(g['nodes']), len(g['edges']), t.get('seat',0), len(adv))
          PY
          )
          {
            echo 'report<<EOF'
            echo "Wiring gates: PASS (referential integrity holds)"
            echo "Nodes: $nodes | Edges: $edges | Seats: $seats"
            echo "Advisory (non-blocking): $advisories"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-topology
          path: topology-out/
          retention-days: 30
      - run: gh pr comment "$PR_NUMBER" --body "$REPORT"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.summary.outputs.report }}
