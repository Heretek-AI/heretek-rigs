# docker-release: multi-arch heretek-rigs fleet images -> ghcr.io (public).
#
# Pipeline: verify-fleet (host gate) -> build (buildx matrix slim/full x
# amd64/arm64, provenance max + SBOM) -> smoke (in-container gates) -> attest.
# All third-party actions are pinned to full commit SHAs (repo policy).
name: docker-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "fleet/**"
      - "scripts/**"
      - "rigs/**"
      - "specs/**"
      - "registry/**"
      - "rosters/**"
      - "schemas/**"
      - "tests/**"
      - "Makefile"
      - "docker-compose.sidecars.yml"
      - ".github/workflows/docker-release.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-fleet:
    name: Host verification gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pip install --quiet pyyaml jsonschema
      - run: ./scripts/verify-rigs.sh --check-only
      - run: python3 ./scripts/audit_loop.py --self-test
      - run: |
          ! make guard-profiles SIDECAR_PROFILES="mobile devsec"
          ! make guard-profiles SIDECAR_PROFILES="mobile web-research"
          make guard-profiles SIDECAR_PROFILES="web-research"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    needs: verify-fleet
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            INSTALL_R2MCP=${{ matrix.target == 'full' && 'true' || 'false' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.target == 'full' && 'full' || 'latest' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}${{ matrix.target == 'full' && '-full' || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: github.event_name != 'pull_request'
        with:
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke:
    name: In-container gates (${{ matrix.target }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        target: [slim, full]
    container:
      image: ghcr.io/${{ github.repository }}:${{ matrix.target == 'full' && 'full' || 'latest' }}
      options: --user 1000:1000
    env:
      GATE_TIMEOUT: 120
      HERETEK_SEED: "0"
      HERETEK_START_DAEMON: "0"
    steps:
      - run: bash ./scripts/verify-rigs.sh --check-only
      - run: python3 ./scripts/audit_loop.py --self-test
      - run: bash ./scripts/gate-role.sh appsec-engineer
      - run: bash ./scripts/gate-role.sh exec-director
      - run: bash ./scripts/gate-role.sh go-backend-eng
