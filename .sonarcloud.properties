# SonarCloud automatic analysis settings.
# rigs/, specs/, registry/ and rosters/ are generated by scripts/generate-rigs.py,
# and each rig vendors byte-identical copies of the shared skills (verify-rigs V21
# enforces that). Leave them out of duplication only; every other rule still runs.
sonar.cpd.exclusions=rigs/**,specs/**,registry/**,rosters/**
