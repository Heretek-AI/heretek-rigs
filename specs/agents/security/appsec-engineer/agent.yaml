name: appsec-engineer
version: '1.0'
description: Application Security (AppSec) Engineer (Defensive Security, Binary Analysis & Forensics) — Muse Spark 1.3 Contributor
  via OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Application Security (AppSec) Engineer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:code-review
      - heretek-shared:security-audit
      - heretek-shared:semgrep
      - heretek-shared:sarif-parsing
      - heretek-shared:variant-analysis
      - heretek-shared:fp-check
      - heretek-shared:security-review
      - owasp-reachability-triage
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: owasp-reachability-triage
    path: skills/owasp-reachability-triage
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
