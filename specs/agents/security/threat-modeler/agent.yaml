name: threat-modeler
version: '1.0'
description: Threat Modeling & Hardening Engineer (Defensive Security, Binary Analysis & Forensics) — Muse Spark 1.3 Contributor
  via OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Threat Modeling & Hardening Engineer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: xhigh
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:messaging-the-human
      - heretek-shared:orienting-to-an-inherited-seat
      - heretek-shared:session-compaction-and-restore
      - heretek-shared:security-audit
      - heretek-shared:entry-point-analyzer
      - heretek-shared:audit-context-building
      - stride-threat-modeling
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: stride-threat-modeling
    path: skills/stride-threat-modeling
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
