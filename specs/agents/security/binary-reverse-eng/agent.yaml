name: binary-reverse-eng
version: '1.0'
description: Binary & Protocol Reverse Engineer (Defensive Security, Binary Analysis & Forensics) — Muse Spark 1.3 Contributor
  via OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Binary & Protocol Reverse Engineer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: xhigh
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:dwarf-expert
      - heretek-shared:yara-rule-authoring
      - radare2-defensive-disassembly
      - rea-evidence-based-decompilation
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: radare2-defensive-disassembly
    path: skills/radare2-defensive-disassembly
  - id: rea-evidence-based-decompilation
    path: skills/rea-evidence-based-decompilation
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
