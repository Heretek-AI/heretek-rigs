version: '0.2'
name: heretek-omni-fleet
summary: Full 51-seat static profile for Heretek Omni Fleet across all 15 pods.
culture_file: CULTURE.md
permission_policy: builtin:standard
non_interruptive: false
docs:
- path: README.md
- path: SETUP.md
pods:
- id: exec
  label: Executive
  summary: Executive pod led by exec-director.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: exec-director
    label: Director / CEO-Delegate
    agent_ref: local:agents/exec-director
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: exec-director
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
