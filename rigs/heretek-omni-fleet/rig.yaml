version: '0.2'
name: heretek-omni-fleet
summary: Master composable 51-agent omni-fleet topology booting a 3-seat command center with 15 pod fragments and 51 member
  fragments for dynamic scaling.
culture_file: CULTURE.md
permission_policy: builtin:standard
non_interruptive: false
docs:
- path: README.md
- path: SETUP.md
pods:
- id: command
  label: Command
  summary: Command pod led by exec-director.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: exec-director
    label: Director / CEO-Delegate
    agent_ref: local:agents/exec-director
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: exec-director
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: tpm-scrum-lead
    label: Technical Product Manager / Scrum Lead
    agent_ref: local:agents/tpm-scrum-lead
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: tpm-scrum-lead
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: system-architect
    label: System Architect
    agent_ref: local:agents/system-architect
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: system-architect
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
  - kind: delegates_to
    from: exec-director
    to: tpm-scrum-lead
  - kind: collaborates_with
    from: system-architect
    to: tpm-scrum-lead
edges: []
