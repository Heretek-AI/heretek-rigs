id: mobile
label: Native Mobile
summary: Native Mobile pod led by android-mobile-spec.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: android-mobile-spec
  label: Mobile Android Specialist
  agent_ref: local:agents/android-mobile-spec
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: android-mobile-spec
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: ios-mobile-spec
  label: Mobile iOS Specialist
  agent_ref: local:agents/ios-mobile-spec
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: ios-mobile-spec
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: android-mobile-spec
  to: ios-mobile-spec
