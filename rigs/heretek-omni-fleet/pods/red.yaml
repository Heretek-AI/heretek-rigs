id: red
label: Red Team & Forensics
summary: Red Team & Forensics pod led by ai-red-teamer.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: ai-red-teamer
  label: Adversarial AI Red-Teamer
  agent_ref: local:agents/ai-red-teamer
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  role: ai-red-teamer
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: binary-reverse-eng
  label: Binary & Protocol Reverse Engineer
  agent_ref: local:agents/binary-reverse-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  role: binary-reverse-eng
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: firmware-sec-analyst
  label: Firmware & Embedded Security Analyst
  agent_ref: local:agents/firmware-sec-analyst
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: firmware-sec-analyst
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: ai-red-teamer
  to: binary-reverse-eng
- kind: delegates_to
  from: ai-red-teamer
  to: firmware-sec-analyst
