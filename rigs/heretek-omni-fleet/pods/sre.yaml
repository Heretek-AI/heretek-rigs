id: sre
label: Site Reliability
summary: Site Reliability pod led by sre-incident-eng.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: sre-incident-eng
  label: Site Reliability Engineer (SRE)
  agent_ref: local:agents/sre-incident-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: sre-incident-eng
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: observability-eng
  label: Observability & Telemetry Engineer
  agent_ref: local:agents/observability-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: observability-eng
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: sre-incident-eng
  to: observability-eng
