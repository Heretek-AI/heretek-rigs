id: engine
label: Engine
summary: Engine pod led by engine-systems-eng.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: engine-systems-eng
  label: Engine & Systems Programmer
  agent_ref: local:agents/engine-systems-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: engine-systems-eng
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: physics-sim-eng
  label: Physics & Simulation Engineer
  agent_ref: local:agents/physics-sim-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: physics-sim-eng
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: graphics-shader-eng
  label: Graphics & Shader Engineer
  agent_ref: local:agents/graphics-shader-eng
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: graphics-shader-eng
  permission_policy: builtin:standard
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: engine-systems-eng
  to: physics-sim-eng
- kind: delegates_to
  from: engine-systems-eng
  to: graphics-shader-eng
