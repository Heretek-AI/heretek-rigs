id: delivery
label: Delivery
summary: Delivery pod led by tpm-scrum-lead.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: tpm-scrum-lead
  label: Technical Product Manager / Scrum Lead
  agent_ref: local:agents/tpm-scrum-lead
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: tpm-scrum-lead
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: git-drift-coord
  label: Git & Worktree Drift Coordinator
  agent_ref: local:agents/git-drift-coord
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: git-drift-coord
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: tech-docs-lead
  label: Technical Documentation Lead
  agent_ref: local:agents/tech-docs-lead
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: tech-docs-lead
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: tpm-scrum-lead
  to: git-drift-coord
- kind: delegates_to
  from: tpm-scrum-lead
  to: tech-docs-lead
