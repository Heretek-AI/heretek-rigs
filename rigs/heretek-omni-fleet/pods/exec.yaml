id: exec
label: Executive
summary: Executive pod led by exec-director.
continuity_policy:
  enabled: true
  sync_triggers:
  - pre_compaction
  - pre_shutdown
  - milestone
  artifacts:
    session_log: true
    restore_brief: true
    quiz: false
  restore_protocol:
    peer_driven: true
    verify_via_quiz: false
members:
- id: exec-director
  label: Director / CEO-Delegate
  agent_ref: local:agents/exec-director
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  role: exec-director
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: product-director
  label: Product Director / Head of Product
  agent_ref: local:agents/product-director
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  role: product-director
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
- id: system-architect
  label: System Architect
  agent_ref: local:agents/system-architect
  profile: default
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  role: system-architect
  permission_policy: builtin:locked
  cwd: .
  restore_policy: resume_if_possible
  compaction_strategy: default-compaction
edges:
- kind: delegates_to
  from: exec-director
  to: product-director
- kind: delegates_to
  from: exec-director
  to: system-architect
