name: ai-red-teamer
version: '1.0'
description: Adversarial AI Red-Teamer (Defensive Security, Binary Analysis & Forensics) — Muse Spark 1.3 Contributor via
  OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: xhigh
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Adversarial AI Red-Teamer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: xhigh
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:messaging-the-human
      - heretek-shared:orienting-to-an-inherited-seat
      - heretek-shared:session-compaction-and-restore
      - heretek-shared:skill-scanner
      - heretek-shared:agentic-actions-auditor
      - auditing-mcp-servers-for-tool-poisoning
      - detecting-ai-model-prompt-injection-attacks
      - detecting-indirect-prompt-injection
      - testing-for-system-prompt-leakage
      - testing-prompt-injection-in-rag-pipelines
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: auditing-mcp-servers-for-tool-poisoning
    path: skills/auditing-mcp-servers-for-tool-poisoning
  - id: detecting-ai-model-prompt-injection-attacks
    path: skills/detecting-ai-model-prompt-injection-attacks
  - id: detecting-indirect-prompt-injection
    path: skills/detecting-indirect-prompt-injection
  - id: testing-for-system-prompt-leakage
    path: skills/testing-for-system-prompt-leakage
  - id: testing-prompt-injection-in-rag-pipelines
    path: skills/testing-prompt-injection-in-rag-pipelines
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
