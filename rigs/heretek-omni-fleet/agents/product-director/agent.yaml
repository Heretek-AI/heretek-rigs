name: product-director
version: '1.0'
description: Product Director / Head of Product (Executive & Product Management) — Muse Spark 1.3 Contributor via OpenCode
  Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Product Director / Head of Product on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:brainstorming
      - heretek-shared:writing-plans
      - heretek-shared:subagent-driven-development
      - epic-roadmap-authoring
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: epic-roadmap-authoring
    path: skills/epic-roadmap-authoring
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
