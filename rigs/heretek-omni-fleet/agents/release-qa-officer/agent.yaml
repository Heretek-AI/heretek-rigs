name: release-qa-officer
version: '1.0'
description: Release QA & Acceptance Sign-off Officer (Quality Assurance & Verification) — Muse Spark 1.3 Contributor via
  OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Release QA & Acceptance Sign-off Officer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:messaging-the-human
      - heretek-shared:orienting-to-an-inherited-seat
      - heretek-shared:session-compaction-and-restore
      - heretek-shared:code-review
      - heretek-shared:requesting-code-review
      - heretek-shared:tdd
      - heretek-shared:verification-before-completion
      - heretek-shared:finishing-a-development-branch
      - heretek-shared:find-bugs
      - release-readiness-audit
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: release-readiness-audit
    path: skills/release-readiness-audit
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
