name: e2e-browser-qa
version: '1.0'
description: End-to-End Browser Automation Engineer (Quality Assurance & Verification) — Muse Spark 1.3 Contributor via OpenCode
  Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for End-to-End Browser Automation Engineer on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:requesting-code-review
      - heretek-shared:verification-before-completion
      - heretek-shared:webapp-testing
      - playwright-page-object-automation
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: playwright-page-object-automation
    path: skills/playwright-page-object-automation
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
