name: rust-systems-spec
version: '1.0'
description: Rust Systems Specialist (Specialized Language Engineers) — Muse Spark 1.3 Contributor via OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Rust Systems Specialist on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:messaging-the-human
      - heretek-shared:orienting-to-an-inherited-seat
      - heretek-shared:session-compaction-and-restore
      - heretek-shared:systematic-debugging
      - heretek-shared:test-driven-development
      - heretek-shared:rust-review
      - heretek-shared:cargo-fuzz
      - rust-async-service-hardening
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: rust-async-service-hardening
    path: skills/rust-async-service-hardening
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
