version: '0.2'
name: defensive-sec-and-red-team
summary: 'Zero-trust defensive security and red-team rig: STRIDE threat modeling, SAST reachability, cloud IAM auditing, SPDX/SBOM
  compliance, LLM red-teaming, and Ghidra/Radare2 reverse engineering.'
culture_file: CULTURE.md
permission_policy: builtin:locked
non_interruptive: false
docs:
- path: README.md
- path: SETUP.md
pods:
- id: blue
  label: Blue Team
  summary: Blue Team pod led by threat-modeler.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: threat-modeler
    label: Threat Modeling & Hardening Engineer
    agent_ref: local:agents/threat-modeler
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: threat-modeler
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: appsec-engineer
    label: Application Security (AppSec) Engineer
    agent_ref: local:agents/appsec-engineer
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: appsec-engineer
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: cloud-sec-auditor
    label: Cloud Security & IAM Auditor
    agent_ref: local:agents/cloud-sec-auditor
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: cloud-sec-auditor
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: compliance-auditor
    label: Compliance & License Auditor
    agent_ref: local:agents/compliance-auditor
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: compliance-auditor
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
  - kind: delegates_to
    from: threat-modeler
    to: appsec-engineer
  - kind: delegates_to
    from: threat-modeler
    to: cloud-sec-auditor
  - kind: delegates_to
    from: threat-modeler
    to: compliance-auditor
- id: red
  label: Red Team & Forensics
  summary: Red Team & Forensics pod led by ai-red-teamer.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: ai-red-teamer
    label: Adversarial AI Red-Teamer
    agent_ref: local:agents/ai-red-teamer
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: ai-red-teamer
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: binary-reverse-eng
    label: Binary & Protocol Reverse Engineer
    agent_ref: local:agents/binary-reverse-eng
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: binary-reverse-eng
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: firmware-sec-analyst
    label: Firmware & Embedded Security Analyst
    agent_ref: local:agents/firmware-sec-analyst
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: firmware-sec-analyst
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
  - kind: delegates_to
    from: ai-red-teamer
    to: binary-reverse-eng
  - kind: delegates_to
    from: ai-red-teamer
    to: firmware-sec-analyst
edges:
- kind: collaborates_with
  from: blue.threat-modeler
  to: red.ai-red-teamer
- kind: can_observe
  from: blue.appsec-engineer
  to: red.binary-reverse-eng
