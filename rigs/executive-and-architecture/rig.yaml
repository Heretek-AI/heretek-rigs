version: '0.2'
name: executive-and-architecture
summary: Executive governance, product strategy, sprint decomposition, system architecture, git drift coordination, and technical
  documentation squad.
culture_file: CULTURE.md
permission_policy: builtin:locked
non_interruptive: false
docs:
- path: README.md
- path: SETUP.md
pods:
- id: exec
  label: Executive
  summary: Executive pod led by exec-director.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: exec-director
    label: Director / CEO-Delegate
    agent_ref: local:agents/exec-director
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: exec-director
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: product-director
    label: Product Director / Head of Product
    agent_ref: local:agents/product-director
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: product-director
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: system-architect
    label: System Architect
    agent_ref: local:agents/system-architect
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: xhigh
    role: system-architect
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
  - kind: delegates_to
    from: exec-director
    to: product-director
  - kind: delegates_to
    from: exec-director
    to: system-architect
- id: delivery
  label: Delivery
  summary: Delivery pod led by tpm-scrum-lead.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: tpm-scrum-lead
    label: Technical Product Manager / Scrum Lead
    agent_ref: local:agents/tpm-scrum-lead
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: tpm-scrum-lead
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: git-drift-coord
    label: Git & Worktree Drift Coordinator
    agent_ref: local:agents/git-drift-coord
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: git-drift-coord
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: tech-docs-lead
    label: Technical Documentation Lead
    agent_ref: local:agents/tech-docs-lead
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: tech-docs-lead
    permission_policy: builtin:locked
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
  - kind: delegates_to
    from: tpm-scrum-lead
    to: git-drift-coord
  - kind: delegates_to
    from: tpm-scrum-lead
    to: tech-docs-lead
edges:
- kind: delegates_to
  from: exec.exec-director
  to: delivery.tpm-scrum-lead
- kind: collaborates_with
  from: exec.system-architect
  to: delivery.tpm-scrum-lead
- kind: can_observe
  from: exec.product-director
  to: delivery.tech-docs-lead
