edges:
- kind: collaborates_with
  from: platform.cloud-platform-eng
  to: sre.sre-incident-eng
- kind: collaborates_with
  from: data.dba-specialist
  to: ml.mlops-serving-eng
- kind: escalates_to
  from: sre.sre-incident-eng
  to: platform.cloud-platform-eng
