    from: dba-specialist
    to: cache-streaming-eng
  - kind: delegates_to
    from: dba-specialist
    to: data-pipeline-eng
  - kind: delegates_to
    from: dba-specialist
    to: analytics-metrics-eng
- id: ml
  label: ML Serving & Retrieval
  summary: ML Serving & Retrieval pod led by mlops-serving-eng.
  continuity_policy:
    enabled: true
    sync_triggers:
    - pre_compaction
    - pre_shutdown
    - milestone
    artifacts:
      session_log: true
      restore_brief: true
      quiz: false
    restore_protocol:
      peer_driven: true
      verify_via_quiz: false
  members:
  - id: mlops-serving-eng
    label: MLOps & Model Serving Engineer
    agent_ref: local:agents/mlops-serving-eng
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: mlops-serving-eng
    permission_policy: builtin:standard
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  - id: vector-rag-spec
    label: Vector Search & RAG Specialist
    agent_ref: local:agents/vector-rag-spec
    profile: default
    runtime: pi
    model: opencode-go/muse-spark-1.3-contributor:high
    effort: high
    role: vector-rag-spec
    permission_policy: builtin:standard
    cwd: .
    restore_policy: resume_if_possible
    compaction_strategy: default-compaction
  edges:
