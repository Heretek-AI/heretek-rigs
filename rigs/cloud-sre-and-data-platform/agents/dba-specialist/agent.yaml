name: dba-specialist
version: '1.0'
description: Database Administrator (DBA) (Cloud, Platform & Site Reliability) — Muse Spark 1.3 Contributor via OpenCode Go
defaults:
  runtime: pi
  model: opencode-go/muse-spark-1.3-contributor:high
  effort: high
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible
imports:
- ref: local:../_shared
  version: '1.0'
profiles:
  default:
    summary: Default Pi profile for Database Administrator (DBA) on Muse Spark 1.3 Contributor
    preferences:
      runtime: pi
      model: opencode-go/muse-spark-1.3-contributor:high
      effort: high
    uses:
      skills:
      - heretek-shared:openrig-operating-model
      - heretek-shared:mission-slice-sop
      - heretek-shared:delegating-work
      - heretek-shared:queue-handoff
      - heretek-shared:refocusing
      - heretek-shared:seat-continuity-and-handover
      - heretek-shared:messaging-the-human
      - heretek-shared:orienting-to-an-inherited-seat
      - heretek-shared:session-compaction-and-restore
      - heretek-shared:supabase-postgres-best-practices
      - heretek-shared:prisma-postgres-setup
      - zero-downtime-migration-audit
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []
    lifecycle:
      compaction_strategy: default-compaction
      restore_policy: resume_if_possible
resources:
  skills:
  - id: zero-downtime-migration-audit
    path: skills/zero-downtime-migration-audit
startup:
  files:
  - path: startup/context.md
    delivery_hint: send_text
    required: true
    applies_on:
    - fresh_start
  actions: []
